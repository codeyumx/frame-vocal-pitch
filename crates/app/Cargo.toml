[package]
name = "frame-vocal-pitch"
description = "Vocal pitch trainer overlay for SteamVR on the Steam Frame"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "frame_vocal_pitch"
path = "src/lib.rs"

[[bin]]
name = "frame-vocal-pitch"
path = "src/main.rs"

[dependencies]
fvp-audio = { path = "../audio" }
fvp-config = { path = "../config" }
fvp-openvr = { path = "../openvr" }
fvp-pitch = { path = "../pitch" }
fvp-ui = { path = "../ui" }
log = { version = "0.4", features = ["std"] }
nix = { version = "0.29", default-features = false, features = ["fs", "poll", "process", "signal", "user"] }
rtrb = "0.4"
signal-hook = { version = "0.3", default-features = false }
